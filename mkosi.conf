[Distribution]
Distribution=arch
Architecture=x86-64

[Output]
ImageId=garuda
OutputDirectory=mkosi.output
# Kept as CI artifact. build.sh copies the live manifest next to the ISO.
ManifestFormat=json
# No <output>.vmlinuz copies: build.sh takes the kernel from the live tree
SplitArtifacts=

[Build]
CacheDirectory=mkosi.cache
# Same filesystem as mkosi.output, so layers are moved instead of copied
WorkspaceDirectory=mkosi.workspace
# Not the checkout: mkosi refuses a workspace inside the build sources. Only
# the mhwd postinst reads mkosi.packages/, scripts do not see mkosi's local
# repository. build.sh and lint.sh create the directory, BuildSources= needs it.
BuildSources=mkosi.packages:local-packages
# Inside the repository so the builder container sees it too
PackageCacheDirectory=mkosi.cache/packages
# mkosi disables it for BaseTrees= layers, build.sh reuses those by stamps.
Incremental=yes
# Pinned so tool versions only change on purpose. Bump it now and then so its
# archlinux-keyring knows new packager keys.
ToolsTree=yes
ToolsTreeDistribution=arch
ToolsTreeSnapshot=2026/11/06
ToolsTreePackages=arch-install-scripts
                  cryptsetup
                  dosfstools
                  erofs-utils
                  mtools
                  python-pefile
                  qemu-img
                  rsync
WithNetwork=yes
Environment=KERNEL=linux-garuda
# snap-pac (from snapper-support-sdboot) cannot snapshot in the build chroot
Environment=SNAP_PAC_SKIP=y
# The garuda-config-agent hook writes Python sets into configs.db. A fixed
# hash seed keeps their order, and so the layers, the same between builds.
Environment=PYTHONHASHSEED=0

[Config]
MinimumVersion=27
# mkosi 27 rebuilds every sub-image of an output, even when its tree exists.
# build.sh sets GARUDA_BUILD_<LAYER> only for layers to rebuild, and each
# layer matches on it, so mkosi does not see the reused ones.
PassEnvironment=KERNEL SNAP_PAC_SKIP PYTHONHASHSEED
                GARUDA_BUILD_BASE
                GARUDA_BUILD_ROOT
                GARUDA_BUILD_DESKTOP
                GARUDA_BUILD_LIVE
                GARUDA_BUILD_MHWD
                GARUDA_BUILD_LIVE_INITRD
