# Same repository order as garuda-tools data/pacman-multilib.conf.
# mkosi uses this file as is, so mkosi's Mirror= has no effect.
# The Arch mirror is set in pacman.d/mirrorlist (garuda-tools build_mirror).
# build.sh fetches chaotic-mirrorlist and the chaotic keyring.

[options]
HoldPkg     = pacman glibc
Architecture = auto
ParallelDownloads = 5
SigLevel    = Required DatabaseOptional
LocalFileSigLevel = Optional

# mkosi's [mkosi] repository of mkosi.packages/ (empty without local packages).
# mkosi adds this line only to a pacman.conf it writes itself, and pacman takes
# a package from the first repository that has it, so it must come first.
Include = /etc/mkosi-local.conf

[garuda]
Include = /etc/pacman.d/chaotic-mirrorlist

[core]
Include = /etc/pacman.d/mirrorlist

[extra]
Include = /etc/pacman.d/mirrorlist

[multilib]
Include = /etc/pacman.d/mirrorlist

[chaotic-aur]
Include = /etc/pacman.d/chaotic-mirrorlist
