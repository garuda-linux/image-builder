# A virtual machine disk of an edition for virt-manager and other QEMU front
# ends: the desktop layer of the edition, installed the way Calamares installs
# it, without the live and mhwd layers. build.sh vm <edition> builds it, see
# docs/building.md. lib/vm.sh does what the installer does on a real install.

[Output]
Format=disk
Output=%i-vm
RepartDirectories=%C/mkosi.repart
# A VM disk, never booted as a CD
ElTorito=no

[Content]
Bootable=no                # build.sh installs systemd-boot and the UKIs
BaseTrees=%O/desktop
