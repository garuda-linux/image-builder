# A virtual machine disk of an edition for virt-manager and other QEMU front
# ends: the desktop layer of the edition, installed the way Calamares installs
# it, without the live and drivers layers. build.sh vm <edition> builds it, see
# docs/building.md. lib/vm.sh does what the installer does on a real install.

[Output]
Format=disk
Output=%i-vm
RepartDirectories=%C/mkosi.repart
# A VM disk, never booted as a CD
ElTorito=no

[Content]
# Inode numbers and ctimes of the build, so no two builds give the same file
RemoveFiles=/var/cache/ldconfig/aux-cache
Bootable=no                # build.sh installs systemd-boot and the UKIs
BaseTrees=%O/desktop
Packages=
        libnotify          # notify-send for /usr/lib/garuda/vm-password-reminder
        garuda-hardware-profile-vm
