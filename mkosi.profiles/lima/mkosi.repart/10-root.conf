# Same subvolume layout as a Calamares install
[Partition]
Type=root
Label=garuda
Format=btrfs
Compression=zstd
Minimize=guess

CopyFiles=/:/@
CopyFiles=/home:/@home
CopyFiles=/root:/@root
CopyFiles=/srv:/@srv
CopyFiles=/var/cache:/@cache
CopyFiles=/var/log:/@log
CopyFiles=/var/tmp:/@tmp
# Keep the mount points in @, their content goes to their own subvolumes
ExcludeFilesTarget=/@/home/ /@/root/ /@/srv/ /@/var/cache/ /@/var/log/ /@/var/tmp/
Subvolumes=/@ /@home /@root /@srv /@cache /@log /@tmp
