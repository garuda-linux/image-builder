[Output]
Format=disk
Output=%i-lima
RepartDirectories=%C/mkosi.repart
# A VM disk, never booted as a CD
ElTorito=no

[Content]
# Inode numbers and ctimes of the build, so no two builds give the same file
RemoveFiles=/var/cache/ldconfig/aux-cache
PostInstallationScripts=%D/mkosi.shared/garuda-release.chroot
Bootable=no                # build.sh installs systemd-boot and the UKIs
BaseTrees=%O/root
Packages=
        cloud-init         # Lima provisions the VM through cloud-init
        cloud-guest-utils  # growpart for the first-boot disk resize
        openssh
        qemu-guest-agent

[Build]
# /usr/lib/garuda/garuda-release, see mkosi.shared/garuda-release.chroot
Environment=EDITION=lima
