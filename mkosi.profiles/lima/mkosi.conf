[Output]
Format=disk
Output=%i-lima
RepartDirectories=%C/mkosi.repart
# A VM disk, never booted as a CD
ElTorito=no

[Content]
Bootable=no                # build.sh installs systemd-boot and the UKIs
BaseTrees=%O/root
Packages=
        cloud-init         # Lima provisions the VM through cloud-init
        cloud-guest-utils  # growpart for the first-boot disk resize
        openssh
        qemu-guest-agent
