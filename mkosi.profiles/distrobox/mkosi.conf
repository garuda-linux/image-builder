[Output]
Format=oci
Output=%i-distrobox
OciLabels=com.github.containers.toolbox=true
OciLabels=name=garuda-distrobox
OciAnnotations=org.opencontainers.image.title="Garuda Linux distrobox"
               org.opencontainers.image.description="Garuda Linux as a distrobox container, systemd as init with --init. Create it with --pre-init-hooks 'pacman-key --init && pacman-key --populate': the image ships no pacman keyring."
               org.opencontainers.image.source=https://gitlab.com/garuda-linux/tools/image-builder
               org.opencontainers.image.vendor="Garuda Linux"
# Smaller and faster to unpack than gzip. Needs podman 4+ or docker 23+.
CompressOutput=zstd

[Content]
Bootable=no
BaseTrees=%O/base
KernelCommandLine=         # OCI Cmd is /sbin/init plus this, keep it bare
Packages=
        # Garuda specific
        garuda-common-settings
        garuda-icons

        # arch-toolbox extra-packages, without mlocate because base has plocate
        diffutils
        flatpak-xdg-utils
        git
        gnupg
        keyutils
        libp11-kit
        lsof
        mtr
        openssh
        pigz
        tcpdump
        time
        tree
        unzip
        vte-common
        words
        xorg-xauth
        zip
# No initramfs in a container
RemovePackages=
        mkinitcpio
        dracut
        garuda-dracut-support
