[Output]
# lib/oci.sh packs the tree as the second layer over base
Format=directory
Output=%i-distrobox-tree

[Content]
# Inode numbers and ctimes of the build, so no two builds give the same file
RemoveFiles=/var/cache/ldconfig/aux-cache
PostInstallationScripts=%D/mkosi.shared/garuda-release.chroot
PostInstallationScripts=%D/mkosi.shared/oci-pacman.chroot
Bootable=no
BaseTrees=%O/base
Packages=
        # Garuda specific
        garuda-common-settings
        garuda-icons

        # arch-toolbox extra-packages, without mlocate because base has plocate
        diffutils
        flatpak-xdg-utils
        git
        gnupg
        keyutils
        libp11-kit
        lsof
        mtr
        openssh
        pigz
        tcpdump
        time
        tree
        unzip
        vte-common
        words
        xorg-xauth
        zip

[Build]
# /usr/lib/garuda/garuda-release, see mkosi.shared/garuda-release.chroot
Environment=EDITION=distrobox
