[Output]
# lib/oci.sh packs the tree as the second layer over base
Format=directory
Output=%i-oci-tree

[Content]
# Inode numbers and ctimes of the build, so no two builds give the same file
RemoveFiles=/var/cache/ldconfig/aux-cache
PostInstallationScripts=%D/mkosi.shared/garuda-release.chroot
PostInstallationScripts=%D/mkosi.shared/oci-pacman.chroot
Bootable=no
BaseTrees=%O/base

[Build]
# /usr/lib/garuda/garuda-release, see mkosi.shared/garuda-release.chroot
Environment=EDITION=oci
