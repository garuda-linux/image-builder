[Content]
Packages=
        # Audio
        pavucontrol
        playerctl

        # Network
        blueman
        modem-manager-gui
        network-manager-applet
        ufw

        # Input
        numlockx
        wmctrl
        # FIXME: TODO: Replace this with something else
        # xautolock
        xbindkeys
        xcape
        xdotool

        # Utilities
        autorandr
        xdg-desktop-portal
        xdg-desktop-portal-gtk

        # Xorg
        xorg-server
        xorg-server-xephyr
        xorg-xbacklight
        xorg-xhost
        xorg-xinit
        xorg-xinput
        xorg-xkill
        xorg-xprop
        xorg-xrandr
        xorg-xsetroot
        xorg-xwininfo

        # Desktop theming
        beautyline
        garuda-cinnamon-settings
        kvantum
        qt5ct
        plasma5-themes-sweet-full-git

        # Display manager
        accountsservice
        festival
        lightdm
        lightdm-settings
        lightdm-slick-greeter
        mousetweaks
        onboard
        orca

        # Desktop environment
        argyllcms
        cinnamon
        gnome-calculator
        gnome-color-manager
        gnome-logs
        gnome-online-accounts
        gnome-screenshot
        gnome-terminal-transparency
        nemo
        nemo-fileroller
        nemo-image-converter
        nemo-share
        warpinator
        webapp-manager
        xed
        xreader
        xviewer
        xviewer-plugins

        # Desktop environment apps
        ffmpegthumbnailer
        gvfs
        gvfs-afc
        gvfs-goa
        gvfs-gphoto2
        gvfs-mtp
        gvfs-nfs
        gvfs-smb
        libgsf
        libopenraw
        librsvg

        # Other apps
        bleachbit
        celluloid
        gnome-firmware
        gnome-keyring
        gparted
        lollypop
        mintstick
        catfish
        meld
        deluge-gtk

        # Internet
        firedragon
        # Open source drivers
        garuda-hardware-profile-standard-x11

[Build]
# Written to /usr/lib/garuda/garuda-release by mkosi.postinst.chroot
Environment=EDITION=cinnamon
