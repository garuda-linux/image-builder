[Content]
Packages=
        # Cosmic Package Group
        cosmic-app-library
        cosmic-applets
        cosmic-bg
        cosmic-comp
        cosmic-files
        cosmic-greeter
        cosmic-idle
        cosmic-launcher
        cosmic-monitor
        cosmic-notifications
        cosmic-osd
        cosmic-osk
        cosmic-panel
        cosmic-player
        cosmic-randr
        cosmic-screenshot
        cosmic-session
        cosmic-settings
        cosmic-settings-daemon
        cosmic-store
        cosmic-terminal
        cosmic-text-editor
        cosmic-viewer
        cosmic-wallpapers
        cosmic-workspaces
        xdg-desktop-portal-cosmic

        # Secret service, COSMIC has none of its own
        gnome-keyring

        # Disk Utilities
        gparted

        # File/Data Management
        gvfs
        gvfs-afc
        gvfs-gphoto2
        gvfs-mtp
        gvfs-nfs
        gvfs-smb

        # Garuda Packages
        garuda-cosmic-settings

        # Terminal for Setup Assistant
        alacritty

        # Theme
        kvantum
        inter-font              # interface font of garuda-cosmic-settings
        ttf-jetbrains-mono      # monospace and terminal font of garuda-cosmic-settings

        # Web Browser
        firedragon-catppuccin

        # Misc
        xorg-xhost

[Build]
# Written to /usr/lib/garuda/garuda-release by mkosi.postinst.chroot
Environment=EDITION=cosmic
