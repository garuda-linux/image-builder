[Content]
Packages=
        # Input
        wmctrl
        xdotool

        # Utilities
        autorandr
        bluetooth-autoconnect
        power-profiles-daemon
        xdg-desktop-portal-gnome
        xdg-user-dirs-gtk

        # Xorg
        xorg-server
        xorg-xinit
        xorg-xinput

        # Wayland
        xorg-xwayland
        qt5-wayland
        qt6-wayland

        # Desktop theming
        garuda-gnome-settings
        kvantum

        # Display manager
        gdm

        # Desktop environment
        gnome-control-center
        gnome-firmware
        gnome-keyring
        gnome-screenshot
        gnome-session
        gnome-settings-daemon
        gnome-shell
        gnome-system-monitor
        gnome-terminal
        gnome-tweaks
        mutter

        # Desktop environment apps
        loupe
        papers
        ffmpegthumbnailer
        file-roller
        geary
        gnome-text-editor
        gnome-calculator
        gnome-disk-utility
        gnome-shell-extensions
        gvfs
        gvfs-afc
        gvfs-goa
        gvfs-gphoto2
        gvfs-mtp
        gvfs-nfs
        gvfs-smb
        nautilus
        sushi
        localsearch

        # Other apps
        firedragon
        gnome-browser-connector
        mpv
        mpv-uosc

[Build]
# Written to /usr/lib/garuda/garuda-release by mkosi.postinst.chroot
Environment=EDITION=gnome
