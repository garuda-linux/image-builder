[Content]
Packages=
        # Utilities
        bluetooth-autoconnect
        tuned-ppd
        xdg-desktop-portal-gnome
        xdg-user-dirs-gtk

        # Wayland
        xorg-xwayland
        qt5-wayland
        qt6-wayland

        # Desktop theming
        garuda-gnome-settings
        kvantum
        morewaita-icon-theme

        # Display manager
        gdm

        # Desktop environment
        gnome-control-center
        gnome-firmware
        gnome-keyring
        gnome-session
        gnome-settings-daemon
        gnome-shell
        gnome-system-monitor
        gnome-tweaks
        mutter
        ptyxis

        # Desktop environment apps
        loupe
        papers
        decibels
        ffmpegthumbnailer
        file-roller
        gnome-text-editor
        gnome-calculator
        gnome-calendar
        gnome-clocks
        gnome-disk-utility
        gnome-logs
        gnome-weather
        gnome-shell-extension-appindicator
        gnome-shell-extensions
        gvfs
        gvfs-afc
        gvfs-goa
        gvfs-gphoto2
        gvfs-mtp
        gvfs-nfs
        gvfs-smb
        nautilus
        sushi
        localsearch

        # Other apps
        firedragon
        extension-manager
        showtime
        thunderbird

[Build]
# Written to /usr/lib/garuda/garuda-release by mkosi.postinst.chroot
Environment=EDITION=gnome
