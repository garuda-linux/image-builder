[Content]
Packages=
        # Xorg
        xorg-server
        xorg-xinit

        # Utilities
        networkmanager

        # Display manager
        plasma-login-manager

        # Desktop environment
        breeze-gtk
        kde-gtk-config
        kscreen
        kwallet-pam
        plasma-desktop
        plasma-nm
        plasma-pa
        tesseract-data-eng

        # Desktop environment apps
        ark
        dolphin
        konsole

[Build]
# Written to /usr/lib/garuda/garuda-release by mkosi.postinst.chroot
Environment=EDITION=kde-lite
