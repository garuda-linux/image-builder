# Full tree, build.sh computes the ISO layer diff against root.

[Match]
Environment=GARUDA_BUILD_DESKTOP

[Output]
Format=directory
Output=%I

[Content]
# Shared by root, desktop and live, after their own mkosi.postinst.chroot
PostInstallationScripts=%D/mkosi.shared/cleanup.chroot
                        %D/mkosi.shared/garuda-release.chroot
Bootable=no
BaseTrees=%O/root
CleanPackageMetadata=no
Packages=
        # Utilities
        ugrep
        xdg-user-dirs
        xdg-utils

        # Snapshot
        snapper-support-sdboot  # snapshot entries in systemd-boot (snapper-support is the GRUB variant)
        snapper-tools

        # Media
        pipewire-support
        wireplumber
        pipewire-jack       # avoids a conflict

        # Fonts
        wqy-zenhei          # small CJK font

        # Garuda specific
        garuda-toolbox
        garuda-common-settings
        garuda-fish-config  # lets users switch to fish, bash stays the default
        garuda-icons
        garuda-setup-assistant
        garuda-system-maintenance

        # Open source drivers
        garuda-hardware-profile-standard
