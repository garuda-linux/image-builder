# iso-profiles >extra packages, which kde-lite (extra=false) leaves out

[Match]
Profiles=!kde-lite

[Content]
Packages=
        # Package management
        downgrade
        paru

        # Firmware
        fwupd

        # Snapshot
        btrfs-assistant

        # Network
        bluetooth-support
        networkmanager-support

        # Media
        gstreamer-meta

        # Input
        input-devices-support

        # Fonts
        noto-fonts          # default font
        noto-fonts-cjk
        noto-fonts-emoji
        ttf-dejavu
        ttf-fantasque-sans-mono
        ttf-fira-sans
        ttf-liberation
        ttf-opensans

        # Archive formats
        lrzip
        lzip
        7zip
        unarchiver
        unrar
        unzip
        zip

        # Garuda specific
        garuda-browser-settings
        garuda-wallpapers
