# Editions override single files from their mkosi.images/live/mkosi.profiles/<edition>/mkosi.extra
---
modules-search: [ local ]

sequence:
    - show:
        - welcome
        - locale
        - keyboard
        - partition
        - users
        - summary
    - exec:
        - partition
        - mount
        - unpackfs
        - networkcfg
        - machineid
        - locale
        - keyboard
        - localecfg
        # No luksbootkeyfile and no dracutlukscfg: their keyfile would end up in
        # the initramfs of the UKI on the unencrypted ESP. The initramfs asks for
        # the passphrase instead, see docs/installer.md
        - fstab
        - users
        - displaymanager
        - ghtcfg
        - hwclock
        - services-systemd
        - postcfg
        - bootloader
        - preservefiles
        - umount
    - show:
        - finished

branding: garuda

prompt-install: true

dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
