---
drawNestedPartitions: false
alwaysShowPartitionLabels: true
efi:
    mountPoint: "/efi"
    recommendedSize: 4GiB
    minimumSize: 1GiB
userSwapChoices:
    - none
    - suspend
defaultFileSystemType: btrfs
# Erase disk: the x86-64 root type lets the generic UKIs find the root without
# root=. Calamares adds the ESP and swap.
partitionLayout:
    - name: "garuda"
      type: "4f68bce3-e8cd-4db1-96e7-fbcaf984b709"
      filesystem: "btrfs"
      mountPoint: "/"
      size: 100%
directoryFilesystemRestrictions:
    - directory: "/"
      allowedFilesystemTypes: ["btrfs"]
    - directory: "efi"
      allowedFilesystemTypes: ["fat32"]
      onlyWhenMountpoint: true
