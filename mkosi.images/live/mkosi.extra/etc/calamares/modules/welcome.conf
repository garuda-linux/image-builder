---
showSupportUrl:         true
showKnownIssuesUrl:     true
showReleaseNotesUrl:    true

requirements:
    requiredStorage:    29.9
    requiredRam:        2.5
    internetCheckUrl:   https://garudalinux.org
    check:
      - storage
      - ram
      - power
      - internet
      - root
      - efi
    required:
      - storage
      - ram
      - root
# Not the JSON style of locale.conf: welcome needs the country code, which only
# the ubiquity XML endpoint returns. locale.conf needs the time zone.
geoip:
    style:  "xml"
    url:    "https://geoip.kde.org/v1/ubiquity"
    selector: "CountryCode"
