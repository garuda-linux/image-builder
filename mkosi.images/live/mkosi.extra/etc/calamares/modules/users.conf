# Editions with other groups override this file
---
defaultGroups:
    - lp
    - wheel
    - video
    - input
    - realtime
autologinGroup:  autologin
doAutologin:     false
sudoersGroup:    wheel
setRootPassword: true
doReusePassword: true
user:
    shell: /bin/bash
passwordRequirements:
    nonempty: true
