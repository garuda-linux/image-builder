# systemd-boot with one UKI per kernel. The module runs bootctl install, writes
# /etc/kernel/cmdline and calls kernel-install add per kernel, which builds the
# UKIs with the kernel-install configuration of the root layer (/etc/kernel/).
---
efiBootLoader: "systemd-boot"

kernelSearchPath: "/usr/lib/modules"
kernelPattern: "^vmlinuz.*"

# "default" is added by the module (the machine ID of the new system)
loaderEntries:
  - "timeout 5"
  - "console-mode keep"
  # As the Shutdown, Restart and firmware entries garuda-common-settings adds to GRUB
  - "auto-firmware yes"
  - "auto-reboot yes"
  - "auto-poweroff yes"
  # No editing of the kernel command line at the menu, such as init=/bin/bash
  - "editor no"

# The module adds rw, root=, rootflags=subvol=@, rd.luks.uuid= and resume=
kernelParams: [ "quiet", "fbcon=font:TER16x32" ]

efiBootMgr: "efibootmgr"
