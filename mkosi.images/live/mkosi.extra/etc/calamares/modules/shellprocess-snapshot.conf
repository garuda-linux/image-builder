# Permanent snapshot of the fresh install with its boot entry. The snapper
# plugin cannot start snapper-sdboot.service in the chroot, so sync runs here.
---
dontChroot: false
timeout: 900

script:
    - "-sh -c 'btrfs subvolume show /.snapshots >/dev/null 2>&1 || btrfs subvolume create /.snapshots'"
    - "-chmod 750 /.snapshots"
    - "-snapper --no-dbus -c root create --description 'Fresh install'"
    - "-snapper-sdboot sync"

i18n:
    name: "Creating the restore point of the fresh install"
