[terminal]
vt = 1

[default_session]
# SwayFX refuses llvmpipe without WLR_RENDERER_ALLOW_SOFTWARE, the live ISO must start on any GPU
command = "env WLR_RENDERER_ALLOW_SOFTWARE=1 systemd-cat -t sway-greeter sway --unsupported-gpu -c /etc/nwg-hello/sway-config"
user = "greeter"

[initial_session]
# Live ISO only:
# Delay the initial autologin slightly to work around a race
# condition observed on NVIDIA hardware during testing.
# sway's output goes to the journal (journalctl -t sway), greetd drops it otherwise
command = "sh -c 'sleep 3; exec env WLR_RENDERER_ALLOW_SOFTWARE=1 systemd-cat -t sway sway --unsupported-gpu'"
user = "garuda"
