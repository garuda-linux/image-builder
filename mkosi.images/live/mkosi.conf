# Full tree, build.sh computes the ISO layer diff against desktop.

[Match]
Environment=GARUDA_BUILD_LIVE

[Output]
Format=directory
Output=%I
# No <output>.vmlinuz copy, nothing reads it
SplitArtifacts=
# build.sh copies it to <iso>.manifest
ManifestFormat=json

[Content]
# Inode numbers and ctimes of the build, so no two builds give the same file
RemoveFiles=/var/cache/ldconfig/aux-cache
# Shared by root, desktop and live, after their own mkosi.postinst.chroot
PostInstallationScripts=%D/mkosi.shared/cleanup.chroot
Bootable=no
BaseTrees=%O/desktop
CleanPackageMetadata=no
Packages=
        # Installer and theming
        calamares-branding-garuda
        calamares-garuda
        garuda-tools-base-git

        # Tools
        arch-install-scripts
        chntpw
        clonezilla
        ddrescue
        fsarchiver
        garuda-live-skel
        garuda-live-systemd
        gparted
        gsmartcontrol
        nbd
        qemu-guest-agent
        spice-vdagent
        smartmontools
        testdisk

[Build]
# Shared by all editions. An edition overrides one in mkosi.profiles/<edition>/mkosi.conf
Environment=LIVE_USER=garuda
            LIVE_PASSWORD=garuda
            LIVE_SHELL=/bin/bash
            LIVE_AUTOLOGIN=true
            LIVE_GROUPS=lp,wheel,video,input,realtime
