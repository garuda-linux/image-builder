# Full tree, build.sh computes the ISO layer diff.
# The kernel comes from mkosi.conf.d/kernel-*.conf, selected by KERNEL.

[Match]
Environment=GARUDA_BUILD_ROOT

[Output]
Format=directory
Output=%I

[Content]
# Inode numbers and ctimes of the build, so no two builds give the same file
RemoveFiles=/var/cache/ldconfig/aux-cache
# Shared by root, desktop and live, after their own mkosi.postinst.chroot
PostInstallationScripts=%D/mkosi.shared/cleanup.chroot
Bootable=no
BaseTrees=%O/base
# The Secure Boot cert of a signed build, empty otherwise (lib/secureboot.sh)
ExtraTrees=%O/.secureboot/root
CleanPackageMetadata=no
Packages=
        # Firmware and microcode
        alsa-firmware
        amd-ucode
        b43-fwcutter
        intel-ucode
        linux-firmware
        sof-firmware
        wireless-regdb
        terminus-font    # vconsole font

        # EFI
        efibootmgr

        # systemd-boot with UKIs (does nothing while systemd-boot is not installed)
        garuda-systemd-boot

        # Filesystem tools
        btrfs-progs
        dosfstools
        e2fsprogs
        exfatprogs
        f2fs-tools
        fatresize
        mtools
        ntfsprogs

        # Disk and system tools
        cryptsetup
        dmidecode
        dracut
        fscrypt
        lvm2
        mdadm

        # Garuda hardware and initramfs
        garuda-hardware-tool
        garuda-dracut-support

# Fail early if KERNEL names a kernel without a kernel-*.conf
[TriggerAssert]
Environment=|KERNEL=linux-garuda
Environment=|KERNEL=linux-lts
Environment=|KERNEL=linux-zen
Environment=|KERNEL=linux
