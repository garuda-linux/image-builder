# build.sh copies the result to /boot/initramfs-x86_64.img of the ISO.

[Match]
Environment=GARUDA_BUILD_LIVE_INITRD

[Include]
Include=mkosi-initrd

[Output]
Output=%I
Format=cpio
CompressOutput=zstd

[Content]
# Modules from root so they match the live kernel. KernelModules= filters them
# after the extra trees are copied, on top of the mkosi-initrd default set.
ExtraTrees=%O/root/usr/lib/modules:/usr/lib/modules
# The kernel headers of the root layer (DKMS, 160 MiB) and the documentation
# (30 MiB, WithDocs=no alone leaves it in), which the initrd does not need
RemoveFiles=/usr/lib/modules/*/build
            /usr/share/doc
            /usr/share/info
            /usr/share/man
KernelModules=
        dm-verity               # the layers are dm-verity devices
        loop                    # copytoram, and the partitions of a CD
        /drivers/usb/host/      # boot from USB sticks
        /drivers/usb/storage/
        /drivers/mmc/           # boot from SD cards
        /drivers/ata/           # controllers besides ahci
Packages=
        coreutils               # cat and stat for garuda-live-mount
        cryptsetup              # veritysetup
        grep
