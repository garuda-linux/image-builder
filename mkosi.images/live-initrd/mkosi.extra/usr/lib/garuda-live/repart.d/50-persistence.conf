# The persistence partition, added by garuda-live-mount with systemd-repart in
# the free space behind the image on the boot stick. Its own type, so repart
# does not match it to one of the layer partitions (linux-generic).
[Partition]
Type=71c4bdb4-2811-45d2-a4ec-deccee24aec5
Label=GARUDA_PERSIST
Format=ext4
SizeMinBytes=1G
