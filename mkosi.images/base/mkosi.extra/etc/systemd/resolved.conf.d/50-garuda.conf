# The DNS servers of the network stay primary. Quad9 is only the fallback when
# the network gives none (Arch also lists Cloudflare and Google).
# DNS over TLS where the server supports it, plain DNS otherwise.
# No mDNS: avahi answers on port 5353 (nss-mdns in nsswitch.conf).
[Resolve]
FallbackDNS=9.9.9.9#dns.quad9.net 2620:fe::9#dns.quad9.net
DNSOverTLS=opportunistic
MulticastDNS=no
