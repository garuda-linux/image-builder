# No kernel, firmware or bootloader: distrobox builds on this layer.

[Match]
Environment=GARUDA_BUILD_BASE

[Output]
Format=directory
Output=%I

[Content]
Bootable=no
CleanPackageMetadata=no    # needed by the layers that use this one in BaseTrees=
Packages=
        # Base system
        base
        bash-completion
        bzip2
        coreutils
        file
        filesystem
        findutils
        gawk
        gcc-libs
        gettext
        glibc
        grep
        gzip
        inetutils
        iproute2
        iputils
        licenses
        pacman
        pciutils
        procps-ng
        psmisc
        sed
        shadow
        sudo
        systemd
        systemd-sysvcompat
        tar
        usbutils
        util-linux
        which
        xz

        # Package management
        pacman-contrib
        rate-mirrors

        # Network tools
        bind
        ethtool
        openbsd-netcat
        iptables
        nmap
        nss-mdns
        traceroute
        wget
        whois

        # Monitoring
        btop
        inxi

        # Utilities
        dialog
        freetype2
        logrotate
        lsb-release
        man-db
        man-pages
        plocate
        xsel

        # Text editors
        micro

        # Chaotic repo
        chaotic-keyring
        chaotic-mirrorlist

        # Garuda core system
        garuda-hooks
        garuda-config-agent
