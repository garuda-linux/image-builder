# iso-profiles >extra and >nonfree_x86_64 packages, which kde-lite (extra=false) leaves out
# Environment= replaces the whole value, so the base list is repeated here.

[Match]
Profiles=!kde-lite

[Build]
Environment="DRIVER_PACKAGES=garuda-hardware-profile-vm broadcom-wl-dkms garuda-hardware-profile-nvidia"
