# DRIVER_PACKAGES are only downloaded to /opt/ght/pkg by mkosi.postinst.chroot.
# On root, shared by every edition. lib/iso.sh makes the ISO layer image from /opt/ght alone.

[Match]
Environment=GARUDA_BUILD_DRIVERS

[Output]
Format=directory
Output=%I
# No <output>.vmlinuz copy, nothing reads it
SplitArtifacts=

[Content]
Bootable=no
BaseTrees=%O/root
CleanPackageMetadata=no

[Build]
Environment=DRIVER_PACKAGES=garuda-hardware-profile-vm
