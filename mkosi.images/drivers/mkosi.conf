# DRIVER_PACKAGES are only downloaded to /opt/ght/pkg by mkosi.postinst.chroot.
# Full tree, build.sh computes the ISO layer diff against desktop.

[Match]
Environment=GARUDA_BUILD_DRIVERS

[Output]
Format=directory
Output=%I

[Content]
Bootable=no
BaseTrees=%O/desktop
CleanPackageMetadata=no

[Build]
Environment=DRIVER_PACKAGES=garuda-hardware-profile-vm
